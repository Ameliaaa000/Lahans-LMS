<div class="app">

  <!-- ===================== Sidebar ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-logo"><img src="logo.png" id="brandLogoImg" alt="Lahans Builder" /></span>
      <button class="icon-btn sidebar-collapse" id="sidebarCollapse" aria-label="Ciutkan sidebar" aria-pressed="false">
        <svg class="icon icon-sm"><use href="#i-chevron-left"/></svg>
      </button>
    </div>

    <div class="side-search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="globalSearch" type="search" placeholder="Cari course, path, materi" aria-label="Cari di Lahans Builder" />
      <kbd>⌘K</kbd>
    </div>

    <nav class="side-nav" id="sideNav" aria-label="Navigasi utama"></nav>

    <div class="side-foot">
      <div class="user-card">
        <div class="avatar">DK</div>
        <div class="user-meta">
          <div class="user-name">Dax Khashyogie</div>
          <div class="user-role">Direktur</div>
        </div>
        <svg class="icon icon-sm"><use href="#i-chevron-up-down"/></svg>
      </div>
    </div>
  </aside>

  <!-- ===================== Content (topbar + main, independent floating cards) ===================== -->
  <div class="content">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Buka navigasi">
        <svg class="icon"><use href="#i-menu"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnTheme" aria-label="Ganti tema" aria-pressed="false">
          <svg class="icon icon-sm"><use href="#i-sun"/></svg>
        </button>
        <button class="icon-btn" id="btnFullscreen" aria-label="Layar penuh" aria-pressed="false">
          <svg class="icon icon-sm"><use href="#i-expand"/></svg>
        </button>
        <div class="notif-wrap" id="notifWrap">
          <button class="icon-btn" id="btnNotif" aria-label="Notifikasi" aria-haspopup="true" aria-expanded="false">
            <svg class="icon icon-sm"><use href="#i-bell"/></svg><i class="dot-badge" id="notifDot"></i>
          </button>
          <div class="notif-panel" id="notifPanel" role="menu" aria-label="Daftar notifikasi">
            <div class="notif-panel-head">
              <strong>Notifikasi</strong>
              <button class="notif-mark" id="notifMarkRead" type="button">Tandai Semua Dibaca</button>
            </div>
            <div class="notif-list" id="notifList"></div>
          </div>
        </div>
        <a class="btn btn-sm" href="https://docs.google.com/document/d/1DEEDvIkvGHfUQeMqncARatVoWRT-JZ5TPQQTieLNVv8/edit" target="_blank" rel="noopener">
          <svg class="icon icon-sm"><use href="#i-external"/></svg> Master Curriculum
        </a>
        <button class="btn btn-primary btn-sm" id="exportBtn">
          <svg class="icon icon-sm"><use href="#i-download"/></svg> Export
        </button>
      </div>
    </header>

    <div class="main">
      <main id="view" class="page" tabindex="-1"></main>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>

<script src="assets/data.js"></script>
<script src="assets/cms.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
